KUBERNETES DEPLOYMENT

# k8s/deployment.yaml

apiVersion: app/v1
kind: Deployment 
metadata:
    name: pathnex-app 
spec: 
    replicas: 2

    selector:
        matchLabels:
            app: pathnx-app 

    template:
        metadata:
            labels: 
                app:pathnex-app
        spec:   
            containers: 
                    - name: pathnex-app
                      images: yuour_DOCKeRHUB_USERNAME/pathnex-app:latest
                  
                      ports:
                        - containerPort: 80 

                      resources:
                        requests:
                            cpu: "100m"
                            memory: "120Mi"
                        limits:
                            cpu: "500m"
                            memory: "128Mi"
                      readinessProbe:
                        httpGet:
                            path: /
                            port: 80
                        initialDelaySeconds: 5
                        periodSeconds : 10

                      livenessProbe:
                        httpGet:
                            path: /
                            port: 80
                        initialDelaySeconds: 10
                        periodSecond: 20


