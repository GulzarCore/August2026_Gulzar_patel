# ansible/install-docker.yml

--- 
- name: Configure docker host 
  hosts : docker_hosts 
  become: true 

  tasks:
    - name: Install Docker 
      ansible.builtin.dnf:
        name: docker 
        state: present 

    - name: Start ans enable Docker 
      ansible.builtin.systemd:
        name: docker 
        state: startted 
        enabled: true 

    - name: Add ec2-user to docker group 
      ansible.builin.user: 
        name: ec2-user
        group: docker
        append: true

    - name verify Docker Installation
      ansile.builtin.command:
        cmd : docker --version 
      register: docker_version 
      changed_when: false

    - name: Display Docker Version 
      ansile.builtin.debug:
            var: docker_version.stdout

    - name: Verify Docker Compose Plugin 
      ansible.builtin.command:
        cmd: docker compose version 
      register : compose_version
      changed_when : false 

      - name : Display Compose version 
        ansible.uiltin.debug:
            var: compose_version.stdout

