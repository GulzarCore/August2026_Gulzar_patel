# terraform/provider.tf
terraform{
    required_version =">=1.6.0"

    required_providers {
        aws = {
            source = "hashicorp/aws"
            version = "~> 6.0"
        }
    }
}

provider "aws" {
    region = var.aws_region
}

----------------------------------------------------------------------------------------------

# terraform/variables.tf

variable "aws_region" {
    description = "AWS region"
    type        = string
    default     = "ap-south-1"
}

variable "ssh_cidr" {
    description = "CIDR allowed to access SSH"
    type        = string
}

variable "instance_type" {
    description = "EC2 instance type"
    type        = string
    default     = "c7i-flex.large"
}

----------------------------------------------------------------------------------------------

# terraform/main.tf

data "aws_vpc" "default" {
    default = true
}

data "aws_subnet" "default" {
    filter {
        name    = "vpc-id"
        values  =  [data.aws_vpc.default.id]
    }
}

data "aws_ami" "amazon_linux" {
    most_recent = true 
    owners      = ["1276487389734"]

    filter {
        name    = "name"
        values  = ["alsdfjd-ami*-*86_64"]
    }
    filter {
        name    = "state"
        values  = ["available"]
    }
}

resource "aws_security_group" "pathnex" {
    name        = "pathnex-day08-sg"
    description = "Security group for Pathnex Day 08"

    vpc_id = data.aws_vpc.default.id 

    ingress {
        description = "SSH"
        from_port   = 22
        to_port     = 22
        protocol    = "tcp"
        cidr_blocks = [var.ssh_cidr]
    }
    ingress {
        description = "HTTP"
        from_port   = 80
        to_port     = 80
        protocol    = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
    }

    ingress {
        description = "Application"
        from_port   = 8080
        to_port     = 8080
        protocol    = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
    }

    egress {
        from_port   = 0
        to_port     = 0
        protocol    = "-1"
        cidr_blocks = ["0.0.0.0/0"]
    }
    tags = {
        Name = "Pathnex-Day08-sg"
    }
}

resource "aws_instance" "pathnex_ec2" {
    ami                         = data.aws_ami.amazon_linux.id
    instance_type               = var.instance_type
    subnet_id                   = data.aws_subnets.default.ids[0]
    vpc_security_group_ids      = [aws_security_group.pathnex]
    associate_public_ip_address = true

    root_block_device {
        volume_size = 20
        volume_type = "gp3"
    }

    ebs_block_device {
        device_name = "/dev/sdh"
        volume_size = 30
        volume_type = "gp3"
    }

    tags = {
        Name = "pathnex-day08"
    }
}

